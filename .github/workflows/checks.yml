name: QUFO checks
on: [push, pull_request]
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-core.txt
      - run: python -m pytest tests -q
      - run: node --check static/app.js
